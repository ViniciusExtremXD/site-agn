<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="photoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <filter id="photoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#22C55E" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  
  <!-- Subtle Wall Texture Line -->
  <line x1="0" y1="230" x2="400" y2="230" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="0" y="230" width="400" height="70" fill="#E2E8F0"/>

  <!-- Main Brazilian Photoluminescent Sign 1 (Saída à Esquerda) -->
  <g filter="url(#photoGlow)" transform="translate(45, 60)">
    <rect x="0" y="0" width="140" height="95" rx="8" fill="#15803D" stroke="#0F172A" stroke-width="3"/>
    <rect x="5" y="5" width="130" height="85" rx="5" fill="none" stroke="#4ADE80" stroke-width="2"/>
    <!-- Running Man Icon -->
    <path d="M52 32 A5 5 0 1 1 52 22 A5 5 0 1 1 52 32 Z" fill="#DCFCE7"/>
    <path d="M44 42 L60 38 L54 56 L68 70" stroke="#DCFCE7" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M50 48 L38 58 L32 72" stroke="#DCFCE7" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arrow Left -->
    <path d="M108 48 L80 48 M92 36 L80 48 L92 60" stroke="#DCFCE7" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#DCFCE7" text-anchor="middle" letter-spacing="0.5">SAÍDA DE EMERGÊNCIA</text>
  </g>

  <!-- Main Brazilian Photoluminescent Sign 2 (Saída à Direita) -->
  <g filter="url(#photoGlow)" transform="translate(215, 60)">
    <rect x="0" y="0" width="140" height="95" rx="8" fill="#15803D" stroke="#0F172A" stroke-width="3"/>
    <rect x="5" y="5" width="130" height="85" rx="5" fill="none" stroke="#4ADE80" stroke-width="2"/>
    <!-- Running Man Icon -->
    <path d="M52 32 A5 5 0 1 1 52 22 A5 5 0 1 1 52 32 Z" fill="#DCFCE7"/>
    <path d="M44 42 L60 38 L54 56 L68 70" stroke="#DCFCE7" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M50 48 L38 58 L32 72" stroke="#DCFCE7" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arrow Right -->
    <path d="M80 48 L108 48 M96 36 L108 48 L96 60" stroke="#DCFCE7" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#DCFCE7" text-anchor="middle" letter-spacing="0.5">SAÍDA DE EMERGÊNCIA</text>
  </g>

  <!-- Small Extinguisher Location Sign Below -->
  <g filter="url(#photoShadow)" transform="translate(145, 175)">
    <rect x="0" y="0" width="110" height="70" rx="6" fill="#C8262C" stroke="#0F172A" stroke-width="2.5"/>
    <rect x="4" y="4" width="102" height="62" rx="4" fill="none" stroke="#FFF" stroke-width="1.5"/>
    <!-- Extinguisher Icon -->
    <rect x="46" y="24" width="18" height="34" rx="5" fill="#FFF"/>
    <rect x="52" y="17" width="6" height="7" rx="1" fill="#FFF"/>
    <circle cx="55" cy="15" r="3" fill="#FFF"/>
    <text x="55" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" fill="#FFF" text-anchor="middle">EXTINTOR</text>
  </g>
</svg>
