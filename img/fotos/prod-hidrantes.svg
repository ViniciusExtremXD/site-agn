<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="cabinetShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Wall -->
  <rect width="400" height="300" fill="url(#bgGrad3)"/>
  <line x1="0" y1="250" x2="400" y2="250" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="0" y="250" width="400" height="50" fill="#E2E8F0"/>

  <!-- Red Steel Fire Hose Cabinet (Abrigo de Hidrante ABNT) -->
  <g filter="url(#cabinetShadow)" transform="translate(100, 30)">
    <!-- Main Red Steel Box Frame -->
    <rect x="0" y="0" width="200" height="210" rx="8" fill="#C8262C" stroke="#0F172A" stroke-width="4"/>
    <rect x="8" y="8" width="184" height="194" rx="4" fill="#991B1E"/>

    <!-- Glass Window Frame -->
    <rect x="18" y="18" width="164" height="174" rx="4" fill="#1E293B" stroke="#C8262C" stroke-width="2"/>
    <rect x="22" y="22" width="156" height="166" rx="2" fill="#0F172A" fill-opacity="0.85"/>

    <!-- Internal Hydraulic Pipe & Brass Valve -->
    <path d="M40 180 L40 130 C40 110 60 110 60 130" fill="none" stroke="#64748B" stroke-width="10" stroke-linecap="round"/>
    <!-- Brass Globe Valve Wheel -->
    <circle cx="60" cy="115" r="14" fill="#D97706" stroke="#78350F" stroke-width="2.5"/>
    <circle cx="60" cy="115" r="6" fill="#F59E0B"/>

    <!-- Coiled Red Canvas Fire Hose inside -->
    <g transform="translate(82, 55)">
      <circle cx="50" cy="50" r="42" fill="none" stroke="#EF4444" stroke-width="12"/>
      <circle cx="50" cy="50" r="28" fill="none" stroke="#DC2626" stroke-width="10"/>
      <circle cx="50" cy="50" r="16" fill="none" stroke="#B91C1C" stroke-width="8"/>
      <!-- Brass Storz Couplings -->
      <rect x="76" y="24" width="18" height="14" rx="3" fill="#D97706" stroke="#78350F" stroke-width="1.5"/>
      <rect x="72" y="22" width="6" height="18" rx="2" fill="#F59E0B"/>
      <!-- Esguicho Regulável de Latão -->
      <path d="M94 25 L125 21 L125 41 L94 37 Z" fill="#D97706" stroke="#78350F" stroke-width="1.5"/>
      <rect x="125" y="19" width="8" height="24" rx="2" fill="#B45309"/>
    </g>

    <!-- Glass Text in Portuguese (ABNT Standard) -->
    <rect x="35" y="165" width="130" height="24" rx="3" fill="#C8262C" stroke="#FFF" stroke-width="1"/>
    <text x="100" y="181" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFF" text-anchor="middle" letter-spacing="2">INCÊNDIO</text>
  </g>
</svg>
